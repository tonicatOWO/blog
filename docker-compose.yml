services:
        cloudflared:
                image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
                restart: unless-stopped
                command: tunnel --no-autoupdate run
                environment:
                        - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

        anubis:
                image: ${ANUBIS_IMAGE:-ghcr.io/techarohq/anubis:latest}
                restart: unless-stopped
                environment:
                        - TARGET=${ANUBIS_TARGET:-http://host.docker.internal:4321}
                        - BIND=${ANUBIS_BIND:-0.0.0.0:3923}
                        - DIFFICULTY=${ANUBIS_DIFFICULTY:-2}
                        - SERVE_ROBOTS_TXT=${ANUBIS_SERVE_ROBOTS_TXT:-true}
                volumes:
                        - ./botPolicy.json:/app/botPolicy.json:ro
                extra_hosts:
                        - 'host.docker.internal:host-gateway'

        redis:
                image: ${REDIS_IMAGE:-redis:alpine}
                restart: unless-stopped
