name: deploy-static-page
on:
        push:
                branches:
                        - trunk
concurrency:
        group: deploy-static-page-${{ forgejo.ref }}
        cancel-in-progress: true
jobs:
        build-and-push:
                runs-on: codeberg-medium
                container:
                        image: oven/bun:alpine
                steps:
                        - name: Checkout
                          uses: https://code.forgejo.org/actions/checkout@v4
                          with:
                                  fetch-depth: 0

                        - name: Install git and other dependencies
                          run: apk add --no-cache git curl

                        - name: Setup git safe directory
                          run: git config --global --add safe.directory "$FORGEJO_WORKSPACE"

                        - name: Install dependencies
                          run: bun install --frozen-lockfile

                        - name: Build site
                          run: bun run build

                        - name: Publish dist to static_page
                          if: ${{ forgejo.ref == 'refs/heads/trunk' }}
                          env:
                                  GIT_AUTHOR_NAME: forgejo-actions
                                  GIT_AUTHOR_EMAIL: forgejo-actions@users.noreply.codeberg.org
                                  GIT_COMMITTER_NAME: forgejo-actions
                                  GIT_COMMITTER_EMAIL: forgejo-actions@users.noreply.codeberg.org
                          run: |
                                  set -euo pipefail
                                  test -d dist
                                  touch dist/.nojekyll
                                  rm -rf /tmp/static_page
                                  mkdir -p /tmp/static_page
                                  cp -a dist/. /tmp/static_page/
                                  cd /tmp/static_page
                                  git init
                                  git checkout -b static_page
                                  git add .
                                  git commit -m "deploy: ${FORGEJO_SHA}"
                                  git remote add origin "https://oauth2:${{ secrets.DEPLOY_TOKEN }}@codeberg.org/${{ forgejo.repository }}.git"
                                  git push --force origin static_page
