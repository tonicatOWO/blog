name: Deploy to Codeberg Pages

on:
        push:
                branches:
                        - trunk

jobs:
        build-and-deploy:
                runs-on: codeberg-tiny

                steps:
                        - name: Checkout
                          uses: https://github.com/actions/checkout@v4

                        - name: Setup Bun
                          uses: https://github.com/oven-sh/setup-bun@v2
                          with:
                                  bun-version: latest

                        - name: Install dependencies
                          run: bun install --frozen-lockfile

                        - name: Build
                          run: bun run build

                        - name: Deploy to Codeberg Pages
                          uses: https://codeberg.org/git-pages/action@v2
                          with:
                                  site: 'https://${{ forge.repository_owner }}.codeberg.page/blog/'
                                  token: ${{ forge.token }}
                                  source: dist/
