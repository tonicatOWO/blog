name: Deploy to Codeberg Pages

on:
        push:
                branches:
                        - main

jobs:
        build-and-deploy:
                runs-on: codeberg-tiny
                steps:
                        - name: Checkout
                          uses: https://github.com/actions/checkout@v4

                        - name: Setup Bun
                          uses: https://github.com/oven-sh/setup-bun@v2
                          with:
                                  bun-version: latest

                        - name: Install dependencies
                          run: bun install --frozen-lockfile

                        - name: Build
                          run: bun run build

                        - name: Deploy to Pages
                          env:
                                  CBTOKEN: ${{ secrets.CODEBERG_TOKEN }}
                                  CBMAIL: ${{ secrets.CODEBERG_EMAIL }}
                          run: |
                                  git config --global user.email "$CBMAIL"
                                  git config --global user.name "Forgejo Actions"
                                  git clone --branch pages https://$CBTOKEN@codeberg.org/${{ github.repository }}.git _pages || \
                                    git clone https://$CBTOKEN@codeberg.org/${{ github.repository }}.git _pages && cd _pages && git checkout --orphan pages && git rm -rf . && cd ..
                                  cd _pages
                                  git rm -rf . 2>/dev/null || true
                                  cp -ar ../dist/. .
                                  git add --all
                                  git diff --cached --quiet || git commit -m "Deploy: ${{ github.sha }}"
                                  git push origin pages
